
name: Update master subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "sources.txt"
      - ".github/workflows/update-subscription.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge subscriptions
        run: |
          python - <<'PY'
          import base64
          import re
          import urllib.request
          from pathlib import Path

          schemes = (
              "vless://", "vmess://", "trojan://", "ss://",
              "ssr://", "hysteria://", "hysteria2://",
              "hy2://", "tuic://", "socks://", "wireguard://"
          )

          urls = [
              x.strip() for x in Path("sources.txt").read_text(
                  encoding="utf-8-sig"
              ).splitlines()
              if x.strip() and not x.strip().startswith("#")
              and x.strip().startswith(("http://", "https://"))
          ]

          configs = []
          seen = set()

          for url in urls:
              try:
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "V2rayAGsub/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read(8 * 1024 * 1024).decode(
                          "utf-8", "ignore"
                      )

                  candidates = [body.strip().lstrip("\ufeff")]
                  compact = re.sub(r"\s+", "", body)
                  try:
                      decoded = base64.b64decode(
                          compact + "=" * (-len(compact) % 4)
                      ).decode("utf-8", "ignore")
                      if any(s in decoded.lower() for s in schemes):
                          candidates.insert(0, decoded)
                  except Exception:
                      pass

                  before = len(configs)
                  for candidate in candidates:
                      for line in candidate.splitlines():
                          line = line.strip()
                          if line.lower().startswith(schemes) and line not in seen:
                              seen.add(line)
                              configs.append(line)

                  print(f"Source processed; new configs: {len(configs)-before}")
              except Exception as e:
                  print(f"Source failed: {e}")

          if not configs:
              raise SystemExit(
                  "No configs extracted; existing sub.txt preserved."
              )

          Path("sub.txt").write_text(
              "\n".join(configs) + "\n", encoding="utf-8"
          )
          print(f"Total unique configs: {len(configs)}")
          PY

      - name: Save updated subscription
        run: |
          if git diff --quiet -- sub.txt; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub.txt
          git commit -m "Update master subscription"
          git push
